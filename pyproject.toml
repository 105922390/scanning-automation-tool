[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconpilot"
version = "0.1.0"
description = "Authorization-first, prompt-driven bug-bounty recon orchestration (local-only)."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "publicsuffixlist>=1.0"]

[project.optional-dependencies]
gui = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["reconpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
